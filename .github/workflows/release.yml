name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Check that the tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${tag}" != "${crate}" ]]; then
            echo "::error::Tag v${tag} does not match workspace version ${crate}"
            exit 1
          fi
          echo "version=${tag}" >> "${GITHUB_OUTPUT}"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Name the installer after the version
        shell: pwsh
        run: Move-Item dist/windows-native/Hlidskjalf-Setup-Rust-x64.exe "dist/Hlidskjalf-Setup-${{ needs.version.outputs.version }}-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Hlidskjalf-Setup-*.exe
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Build
        run: cargo build --release --locked -p hlidskjalf-cli -p hlidskjalf-daemon -p hlidskjalf-desktop
      - name: Package
        run: |
          name="hlidskjalf-${{ needs.version.outputs.version }}-linux-x86_64"
          root="dist/${name}"
          install -Dm755 -t "${root}/target/release" target/release/hlidskjalf target/release/hlidskjalfd target/release/hlidskjalf-desktop
          install -Dm644 -t "${root}/crates/hlidskjalf-desktop/assets" crates/hlidskjalf-desktop/assets/hlidskjalf.png
          install -Dm755 -t "${root}/scripts" scripts/install.sh
          install -Dm644 -t "${root}/scripts" scripts/hlidskjalf-input.service scripts/hlidskjalf.desktop
          install -Dm644 -t "${root}" README.md LICENSE-APACHE LICENSE-MIT
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Extract release notes from the changelog
        run: |
          awk -v version="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for ${{ needs.version.outputs.version }}"
            exit 1
          fi
          (cd assets && sha256sum *) > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* SHA256SUMS \
            --title "Hliðskjálf ${{ needs.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
