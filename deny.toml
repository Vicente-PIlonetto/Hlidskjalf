[graph]
all-features = true
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
ignore = [
    # proc-macro-error is unmaintained; it only runs at build time through glib-macros 0.18
    # (GTK 3, used by tao and wry on Linux), which has no release without it.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, pulled in by GTK 3 bindings" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots certificate data
    "ISC",
    "MIT",
    "MPL-2.0",             # option-ext, through dirs and wry
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
