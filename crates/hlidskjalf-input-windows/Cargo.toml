[package]
name = "hlidskjalf-input-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hlidskjalf-input = { path = "../hlidskjalf-input" }
hlidskjalf-proto = { path = "../hlidskjalf-proto" }
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "deny"
